name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-artifact:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: ./scripts/build.sh

      - name: Test
        run: ./scripts/test.sh

      - name: Generate Artifact
        run: tar -czf ostad-devops-build.tar.gz dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ostad-devops-build
          path: ostad-devops-build.tar.gz
